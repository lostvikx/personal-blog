---
title: Posts
---

<!doctype html>

<html lang="en">
    <head>
        {% include "partials/head.html" %}
    </head>

    <body>
        {% include "partials/nav.html" %}

        <main>
            <section>
                <h1>Blog Posts</h1>
                <p>Posts ordered in recency order of creation.</p>
                <div class="blog-posts">
                    {% for post in collections.posts reversed %}
                    <div>
                        <time>{{ post.data.date | dateStamp }}</time>
                        <a
                            href="{{ post.url }}"
                            title="{{ post.data.description }}"
                            >{{ post.data.title }}</a
                        >
                    </div>
                    {% endfor %}
                </div>
            </section>
        </main>

        {% include "partials/footer.html" %}
    </body>
</html>
